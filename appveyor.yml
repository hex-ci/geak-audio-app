image: Visual Studio 2022

platform:
  - x64

cache:
  # 校验文件变化时缓存失效，避免还原到旧依赖树（Vue2/Webpack 时期）后 npm i 报 ERESOLVE
  - node_modules -> package.json

init:
  - git config --global core.autocrlf input

install:
  - ps: Install-Product node 22 x64
  - npm i

build_script:
  - npm run electron:build:ci

test: off
